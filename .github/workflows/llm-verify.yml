# CI · 真调 LLM 验证（非阻塞）
#
# 独立于主测试流水线：
# - 主流水线（test.yml）跑 mock 模式，秒级反馈，卡 PR 用
# - 本流水线真调 LLM API，慢且可能受网络/额度影响，不卡 PR
#
# 触发方式：
# 1. 手动触发（Actions 页面 "Run workflow"）
# 2. Scheduled（每天凌晨 3 点，避开高峰）
#
# 需要在 repo Settings → Secrets 配置 ANTHROPIC_API_KEY（或 AUTH_TOKEN + BASE_URL）

name: LLM Verification

on:
  workflow_dispatch:  # 手动触发
  schedule:
    - cron: '0 19 * * *'  # UTC 19:00 = 北京时间凌晨 3:00

jobs:
  verify-preflight-agent:
    name: PreflightAgent 真调 LLM 三场景验证
    runs-on: ubuntu-latest
    # 允许失败不阻塞其他 workflow
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify PreflightAgent (real LLM calls)
        env:
          PLATFORM_MOCK: '1'  # 环境采集 mock，但 LLM 真调
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 或用公司网关：
          # ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          # ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: claude-opus-4-8
        run: |
          python test_preflight_llm.py

      - name: Upload verification result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-llm-result
          path: preflight_llm_result_*.txt
          retention-days: 90

      - name: Summary
        if: always()
        run: |
          echo "## LLM 验证结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 场景 1: 环境一致，无漂移 → 预期 CONTINUE" >> $GITHUB_STEP_SUMMARY
          echo "- 场景 2: 设备 ROM 版本变更 → 预期 RERUN_STAGE" >> $GITHUB_STEP_SUMMARY
          echo "- 场景 3: 测试配置被篡改 → 预期 ABORT_TO_HUMAN" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "详细结果见 artifacts。" >> $GITHUB_STEP_SUMMARY
