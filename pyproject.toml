[project]
name = "ai-agent-test-platform"
version = "0.1.0"
description = "AI Agent-based automated testing platform for AIoT devices"
requires-python = ">=3.11"

dependencies = [
    "anthropic>=0.39.0",
    "pydantic>=2.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 包目录是 core/，与 project name 不同名，必须显式声明，
# 否则 hatchling 按项目名找 ai_agent_test_platform/ 目录失败，
# 导致 CI 上 `pip install -e .` 报 "Unable to determine which files to ship"。
[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# 用函数式测试；不按 Test* 收集类，避免误收 TestRequirement/TestCase 等数据模型
python_classes = []
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"
