[project]
name = "ai-agent-test-platform"
version = "0.1.0"
description = "AI Agent-based automated testing platform for AIoT devices"
requires-python = ">=3.11"

dependencies = [
    "anthropic>=0.39.0",
    "pydantic>=2.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# 用函数式测试；不按 Test* 收集类，避免误收 TestRequirement/TestCase 等数据模型
python_classes = []
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"
